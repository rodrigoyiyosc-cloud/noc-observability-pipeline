apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# SIN DESPLEGAR: validado solo con kubeconform. No hay namespace prod ni
# consumidor. Revision: fase de nube (ADR-002).
namespace: prod
resources:
  - ../../deploy/apps/webhook
labels:
  - pairs:
      environment: prod
    includeSelectors: true
    includeTemplates: true
patches:
  - target:
      kind: Deployment
      name: webhook-service
    patch: |-
      - op: replace
        path: /spec/template/spec/affinity/podAntiAffinity/preferredDuringSchedulingIgnoredDuringExecution/0/podAffinityTerm/labelSelector/matchLabels/environment
        value: prod
images:
  - name: noc-webhook-service
    newName: ghcr.io/rodrigoyiyosc-cloud/noc-webhook-service
    digest: sha256:5db75e8301f0ef0ea899954d570809801245a92b8933a71db590e4c4b92f5658
