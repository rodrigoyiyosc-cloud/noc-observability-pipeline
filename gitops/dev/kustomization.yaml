apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Estado deseado de dev. Lo actualiza el pipeline por PR (ADR-002) o, en
# emergencia, scripts/set_image_digest.sh. Consumidores: scripts/deploy_dev.sh
# (dev local en noc-local-cluster) y Argo CD (webhook-dev en noc-tf, ADR-006).
resources:
  - ../../deploy/apps/webhook
images:
  - name: noc-webhook-service
    newName: ghcr.io/rodrigoyiyosc-cloud/noc-webhook-service
    digest: sha256:9a16a4bac4062e825ee3a9ad2f19d2a0bd5fd7434b3e019a253a6108efe7dd24
