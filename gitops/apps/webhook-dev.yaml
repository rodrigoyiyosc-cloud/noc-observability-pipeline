apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webhook-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rodrigoyiyosc-cloud/noc-observability-pipeline.git
    targetRevision: main
    path: gitops/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true