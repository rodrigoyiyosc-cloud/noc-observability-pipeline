# grafana/provisioning/alerting/contact_points.yaml
apiVersion: 1

contactPoints:
  - orgId: 1
    name: noc-webhook-default
    receivers:
      - uid: noc-webhook-001
        type: slack
        settings:
          url: ${SLACK_WEBHOOK_URL}
        disableResolveMessage: false

  - orgId: 1
    name: noc-webhook-critical
    receivers:
      - uid: noc-webhook-002
        type: slack
        settings:
          url: ${SLACK_WEBHOOK_URL}
        disableResolveMessage: false