# k8s/webhook-secret.yaml
#
# Credenciales y config sensible del webhook-service, equivalentes a lo que
# hoy vive en `.env` + `env_file` dentro de docker-compose.yml.
#
# NO commitear este archivo con valores reales. Los placeholders de abajo
# existen solo para documentar las claves esperadas. En AKS, poblar esto vía
# uno de:
#   - `kubectl create secret generic webhook-service-secrets --from-env-file=.env -n <namespace>`
#   - Azure Key Vault Provider for Secrets Store CSI Driver (recomendado en
#     un cluster corporativo — evita tener el secreto en texto plano en git
#     o en el etcd del cluster sin cifrado adicional)
#   - Inyección desde GitHub Actions con `kubectl apply` + `--from-literal`
#     usando los mismos secrets de repo que usa ci.yml para ACR.
apiVersion: v1
kind: Secret
metadata:
  name: webhook-service-secrets
  labels:
    app: webhook-service
type: Opaque
stringData:
  # ── Auth del webhook (Bearer compartido con el contact point de Grafana) ──
  NOC_WEBHOOK_TOKEN: "REEMPLAZAR_TOKEN_WEBHOOK"

  # ── Credenciales de conexión a TimescaleDB (host queda fuera de esta fase; ─
  # ver restricción de alcance en webhook-deployment.yaml) ───────────────────
  PG_PASSWORD: "REEMPLAZAR_PG_PASSWORD"
  PG_DSN: "postgresql+psycopg2://REEMPLAZAR_USER:REEMPLAZAR_PASSWORD@REEMPLAZAR_HOST:5432/noc"

  # ── Integración Jira Cloud ──────────────────────────────────────────────
  JIRA_URL: "https://REEMPLAZAR.atlassian.net"
  JIRA_USER: "REEMPLAZAR_EMAIL"
  JIRA_API_TOKEN: "REEMPLAZAR_JIRA_API_TOKEN"
  JIRA_PROJECT_KEY: "NOC"
  JIRA_RESOLVE_TRANSITION_NAME: "Done"
  JIRA_ISSUE_TYPE: "Incident"

  # ── NOC-MAS (LangGraph + Groq) ───────────────────────────────────────────
  GROQ_API_KEY: "REEMPLAZAR_GROQ_API_KEY"
