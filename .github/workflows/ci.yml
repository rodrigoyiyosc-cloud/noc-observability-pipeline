name: CI

on:
  push:
    branches: ["main"]
    paths-ignore: ["gitops/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: webhook_service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r webhook_service/requirements.txt
          pip install pytest httpx

      - name: Run unit tests
        env:
          # Valores falsos de prueba: main.py exige estas 11 variables al
          # importarse. Nunca usar secretos reales en este job.
          NOC_WEBHOOK_TOKEN: ci-test-token-temporal
          PG_HOST: localhost
          PG_PORT: "5432"
          PG_DB: noc_test
          PG_USER: test_user
          PG_PASSWORD: test-password-not-real
          JIRA_URL: "https://jira.example.invalid"
          JIRA_USER: "test@example.invalid"
          JIRA_API_TOKEN: test-token-not-real
          JIRA_PROJECT_KEY: TST
          GROQ_API_KEY: test-groq-api-key-not-real
        run: python -m pytest tests/test_webhook_endpoints.py tests/test_db_url.py -v

  config-check:
    name: Validate config keys (PM1-A1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check required env keys
        run: python scripts/check_config_keys.py

  manifests:
    name: Validate manifests (kubeconform)
    runs-on: ubuntu-latest
    needs: config-check
    env:
      KUBECONFORM_VERSION: v0.8.0
      K8S_VERSION: "1.37.0"
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz kubeconform
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v
          kubectl version --client
      - name: Validate
        run: bash scripts/validate_manifests.sh

  terraform:
    name: Validate Terraform (fmt, validate, tflint)
    runs-on: ubuntu-latest
    env:
      TF_DIR: infra/terraform/envs/local
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra/terraform
      - name: terraform init y validate
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0
      - name: tflint
        working-directory: ${{ env.TF_DIR }}
        run: tflint --format compact

  image-scan:
    name: Scan image (Trivy 0.69.3)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    env:
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
      LOCAL_TAG: noc-webhook-service:ci
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=$SOURCE_URL" \
            --label "org.opencontainers.image.revision=$REVISION" \
            -t "$LOCAL_TAG" ./webhook_service
      - name: Save image
        run: docker save "$LOCAL_TAG" -o "$RUNNER_TEMP/image.tar"
      - name: Trivy scan
        run: |
          docker run --rm -v "$RUNNER_TEMP:/work" -v "$GITHUB_WORKSPACE:/src" "$TRIVY_IMAGE" image \
            --input /work/image.tar --ignorefile /src/.trivyignore.yaml --scanners vuln,secret \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress --skip-version-check
      - name: Smoke test (kind efímero)
        run: |
          kind version
          kubectl version --client
          bash scripts/smoke_test_kind.sh "$LOCAL_TAG"
      - name: Upload image artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          if-no-files-found: error


