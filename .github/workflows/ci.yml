name: CI

on:
  push:
    branches: ["main", "kubernetes"]
  pull_request:
    branches: ["main", "kubernetes"]

jobs:
  test:
    name: Unit tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: webhook_service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r webhook_service/requirements.txt
          pip install pytest httpx

      - name: Run unit tests
        env:
          # Valores falsos de prueba: main.py exige estas 10 variables al
          # importarse. Nunca usar secretos reales en este job.
          NOC_WEBHOOK_TOKEN: ci-test-token-temporal
          PG_HOST: localhost
          PG_PORT: "5432"
          PG_DB: noc_test
          PG_USER: test_user
          PG_PASSWORD: test-password-not-real
          JIRA_URL: "https://jira.example.invalid"
          JIRA_USER: "test@example.invalid"
          JIRA_API_TOKEN: test-token-not-real
          JIRA_PROJECT_KEY: TST
          GROQ_API_KEY: test-groq-api-key-not-real
        run: python -m pytest tests/test_webhook_endpoints.py tests/test_db_url.py -v

  config-check:
    name: Validate config keys (PM1-A1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check required env keys
        run: python scripts/check_config_keys.py

  docker-build:
    name: Validate Docker build (webhook_service)
    runs-on: ubuntu-latest
    needs: [test, config-check]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build webhook_service image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./webhook_service
          push: false
          tags: noc-webhook-service:ci

      # ── Pasos de Azure ACR pausados durante el aprendizaje local de Kubernetes ──
