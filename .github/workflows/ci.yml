name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests (webhook_service)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r webhook_service/requirements.txt
          pip install pytest httpx

      - name: Run unit tests
        env:
          # Token de prueba temporal: main.py exige NOC_WEBHOOK_TOKEN al
          # importarse; nunca usar un secreto real en este job.
          NOC_WEBHOOK_TOKEN: ci-test-token-temporal
        run: python -m pytest tests/test_webhook_endpoints.py -v

  docker-build:
    name: Validate Docker build (webhook_service)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build webhook_service image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./webhook_service
          push: false
          tags: noc-webhook-service:ci
