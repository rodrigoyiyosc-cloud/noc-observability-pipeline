name: CI

on:
  push:
    branches: ["main", "Fase_3", "Fase_6", "Fase_de_IA_y_ML"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Unit tests (webhook_service)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r webhook_service/requirements.txt
          pip install pytest httpx

      - name: Run unit tests
        env:
          # Token de prueba temporal: main.py exige NOC_WEBHOOK_TOKEN al
          # importarse; nunca usar un secreto real en este job.
          NOC_WEBHOOK_TOKEN: ci-test-token-temporal
        run: python -m pytest tests/test_webhook_endpoints.py -v

  docker-build:
    name: Validate Docker build (webhook_service)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build webhook_service image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./webhook_service
          push: false
          tags: noc-webhook-service:ci

      # ── Fase 2 (Telemetría Inteligente): push a Azure Container Registry.
      # Solo en push a rama (nunca en PR, para no publicar imágenes desde
      # forks/ramas no confiables). Requiere los secrets de repo/org
      # ACR_USERNAME y ACR_PASSWORD (service principal o admin credentials
      # de nocacr.azurecr.io) — placeholders genéricos, sin valores reales.
      - name: Log in to Azure Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: nocacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push webhook_service image to ACR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./webhook_service
          push: true
          tags: |
            nocacr.azurecr.io/noc-webhook-service:latest
            nocacr.azurecr.io/noc-webhook-service:${{ github.sha }}

  deploy-to-aks:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Deploy manifests to AKS
        uses: azure/k8s-deploy@v5
        with:
          namespace: default
          action: deploy
          manifests: |
            k8s/webhook-secret.yaml
            k8s/timescaledb-deployment.yaml
            k8s/timescaledb-service.yaml
            k8s/webhook-deployment.yaml
            k8s/webhook-service.yaml
          images: |
            nocacr.azurecr.io/noc-webhook-service:${{ github.sha }}
