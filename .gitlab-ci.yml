# Definición de las etapas del pipeline
stages:
  - test
  - build

# Configuración global para los disparadores (reemplaza el "on:" de GitHub)
workflow:
  rules:
    # Se ejecuta en ramas específicas ante un push
    - if: $CI_COMMIT_BRANCH =~ /^(main|kubernetes)$/
    # Se ejecuta ante un Merge Request (equivalente a pull_request) dirigido a main
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(main|kubernetes)$/

# 1. Job de Tests Unitarios
unit-tests:
  stage: test
  parallel:
    matrix:
      - PYTHON: ["3.12", "3.13"]
  image: python:${PYTHON}-slim
  cache:
    key:
      files:
        - webhook_service/requirements.txt
    paths:
      - .cache/pip
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    # Token de prueba temporal (reemplaza la sección env:)
    NOC_WEBHOOK_TOKEN: "ci-test-token-temporal"
    PG_HOST: "localhost"
    PG_PORT: "5432"
    PG_DB: "noc_test"
    PG_USER: "test_user"
    PG_PASSWORD: "test-password-not-real"
    JIRA_URL: "https://jira.example.invalid"
    JIRA_USER: "test@example.invalid"
    JIRA_API_TOKEN: "test-token-not-real"
    JIRA_PROJECT_KEY: "TST"
  script:
    - python -m pip install --upgrade pip
    - pip install -r webhook_service/requirements.txt
    - pip install pytest httpx
    - python -m pytest tests/test_webhook_endpoints.py tests/test_db_url.py -v

# 2. Job de Validación de Configuración de Claves (PM1-A1) 
config-check:
  stage: test
  image: python:3.12-slim
  script:
    - python scripts/check_config_keys.py

# 3. Job de Validación de Docker
docker-build:
  stage: build
  image: docker:24.0.9 # Imagen base con el cliente de Docker instalado
  services:
    - docker:24.0.9-dind # Activa Docker-in-Docker para poder compilar imágenes
  needs:
    - unit-tests # Asegura que corra solo si el job 'unit-tests' pasa exitosamente
  script:
    # Comando estándar de Docker para compilar localmente sin subir (no push)
    - docker build -t noc-webhook-service:ci ./webhook_service
