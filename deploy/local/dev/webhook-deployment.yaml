apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-service
  namespace: dev
  labels:
    app.kubernetes.io/name: webhook-receiver
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: noc-observability-pipeline
    environment: dev
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: webhook-receiver
      environment: dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webhook-receiver
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: noc-observability-pipeline
        environment: dev
    spec:
      containers:
        - name: webhook-receiver
          image: noc-webhook-service:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: webhook-config
            - secretRef:
                name: webhook-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
