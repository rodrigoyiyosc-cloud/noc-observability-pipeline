apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-service
  namespace: dev
  labels:
    app.kubernetes.io/name: webhook-receiver
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: noc-observability-pipeline
    environment: dev
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: webhook-receiver
      environment: dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webhook-receiver
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: noc-observability-pipeline
        environment: dev
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: webhook-receiver
          # El tag de la imagen debe coincidir con el tag Git del codigo (v1.0.12).
          image: noc-webhook-service:v1.0.12
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: webhook-config
            - secretRef:
                name: webhook-secret
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Da hasta 120 s para importar LangChain/Groq y abrir el pool de Postgres.
          # Mientras no pase, K8s no ejecuta liveness ni readiness.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 3
            failureThreshold: 40
          # Readiness: puede atender alertas? (verifica Postgres, NO Jira)
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness: el proceso responde? (si falla, reinicia el pod)
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
