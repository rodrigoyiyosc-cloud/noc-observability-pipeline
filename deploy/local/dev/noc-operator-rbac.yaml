apiVersion: v1
kind: ServiceAccount
metadata:
  name: noc-operator
  namespace: dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: noc-operator-role
  namespace: dev
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch"]          # rollout restart / undo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: noc-operator-rb
  namespace: dev
subjects:
  - kind: ServiceAccount
    name: noc-operator
    namespace: dev
roleRef:
  kind: Role
  name: noc-operator-role
  apiGroup: rbac.authorization.k8s.io