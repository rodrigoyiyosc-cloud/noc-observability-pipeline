apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: dev
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-and-monitoring-to-webhook
  namespace: dev
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: webhook-receiver
      environment: dev
  policyTypes:
    - Ingress
  ingress:
    # 1. Trafico L7 desde el Ingress Controller
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 8000
    # 2. Trafico interno desde el namespace monitoring (Grafana)
    - from:
        - namespaceSelector:
            matchLabels:
              environment: monitoring
      ports:
        - protocol: TCP
          port: 8000
---
# Sin esta regla, default-deny-ingress bloquea al webhook cuando Postgres
# corre DENTRO del cluster (StatefulSet timescaledb). No afecta si Postgres
# sigue en Docker fuera del cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webhook-to-timescaledb
  namespace: dev
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: timescaledb
      environment: dev
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: webhook-receiver
              environment: dev
      ports:
        - protocol: TCP
          port: 5432
