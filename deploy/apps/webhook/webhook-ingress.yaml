apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webhook-ingress
  namespace: dev
  labels:
    app.kubernetes.io/name: webhook-receiver
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: noc-observability-pipeline
    environment: dev
spec:
  ingressClassName: nginx
  rules:
    - host: webhook.local
      http:
        paths:
          # Solo se expone lo que necesita el exterior.
          # /api/chat y /ready quedan internos a proposito.
          - path: /alert
            pathType: Exact
            backend:
              service:
                name: webhook-service
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: webhook-service
                port:
                  number: 8000
