# docker-compose.yml
# Añade el servicio grafana a tu compose existente.
# Asume que tu servicio de TimescaleDB se llama "timescaledb" y
# la red compartida se llama "noc_net". Ajusta los nombres si difieren.


services:

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB:       noc
      POSTGRES_USER:     noc_user
      POSTGRES_PASSWORD: secret
    volumes:
      - tsdb_data:/var/lib/postgresql/data
    networks:
      - noc_net
    ports:
      - "5432:5432"

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - timescaledb
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SESSION_PROVIDER: memory
      GF_DEFAULT_APP_MODE: production
      TZ: America/Santiago
      GF_ENABLE_ENVVAR_EXPANSION: "true"
      NOC_WEBHOOK_TOKEN: ${NOC_WEBHOOK_TOKEN}
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_ALERTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    networks:
      - noc_net

  webhook-service:
    build:
      context: ./webhook_service
    container_name: webhook_service
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - timescaledb
    environment:
      PG_HOST: timescaledb
      PG_PORT: "5432"
      PG_DB: noc
      PG_USER: noc_user
      PG_PASSWORD: secret
      NOC_WEBHOOK_TOKEN: ${NOC_WEBHOOK_TOKEN}
    networks:
      - noc_net
    env_file:
      - .env

  # ── Fase 4: simuladores por región (mismo build, distinto REGION) ──────────
  simulator-us-east:
    build:
      context: ./python-simulator
    container_name: simulator_us_east
    restart: unless-stopped
    depends_on:
      - timescaledb
    environment:
      REGION: us-east
      PG_DSN: postgresql://noc_user:secret@timescaledb:5432/noc
    networks:
      - noc_net

  simulator-eu-west:
    build:
      context: ./python-simulator
    container_name: simulator_eu_west
    restart: unless-stopped
    depends_on:
      - timescaledb
    environment:
      REGION: eu-west
      PG_DSN: postgresql://noc_user:secret@timescaledb:5432/noc
    networks:
      - noc_net

  simulator-sa-south:
    build:
      context: ./python-simulator
    container_name: simulator_sa_south
    restart: unless-stopped
    depends_on:
      - timescaledb
    environment:
      REGION: sa-south
      PG_DSN: postgresql://noc_user:secret@timescaledb:5432/noc
    networks:
      - noc_net

networks:
  noc_net:
    driver: bridge

volumes:
  tsdb_data:
  grafana_data: