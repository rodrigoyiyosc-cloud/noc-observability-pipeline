# docker-compose.yml
# Añade el servicio grafana a tu compose existente.
# Asume que tu servicio de TimescaleDB se llama "timescaledb" y
# la red compartida se llama "noc_net". Ajusta los nombres si difieren.



services:

  # ── Tu servicio TimescaleDB existente (referencia para la red) ─────────────
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB:       noc
      POSTGRES_USER:     noc_user
      POSTGRES_PASSWORD: secret
    volumes:
      - tsdb_data:/var/lib/postgresql/data
    networks:
      - noc_net
    ports:
      - "5432:5432"

  # ── Grafana OSS ────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - timescaledb
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SESSION_PROVIDER: memory
      GF_DEFAULT_APP_MODE: production
      TZ: America/Santiago
      # Bearer token
      GF_ENABLE_ENVVAR_EXPANSION: "true"
      NOC_WEBHOOK_TOKEN: ${NOC_WEBHOOK_TOKEN}
      # 
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_ALERTING_ENABLED: "false"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      # No se requiere volumen adicional — alerting/ está incluido

    ports:
      - "3000:3000"
    networks:
      - noc_net
  webhook-service:
    build:
      context: ./webhook_service
    container_name: webhook_service
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - timescaledb
    env_file:
      - ./webhook_service/.env
    environment:
      PG_HOST: timescaledb
      PG_PORT: "5432"
      PG_DB: noc
      PG_USER: noc_user
      PG_PASSWORD: secret
    networks:
      - noc_net

networks:
  noc_net:
    driver: bridge

volumes:
  tsdb_data:
  grafana_data:
