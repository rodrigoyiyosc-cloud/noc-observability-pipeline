# Propósito: almacén S3 local (MinIO) para el estado remoto de Terraform.
# Vive FUERA del clúster kind y fuera del stack de la app: un `down -v`
# del stack no puede borrar el estado. Decisión y riesgo: ver ADR-008.
name: noc-state

services:
  minio:
    image: cgr.dev/chainguard/minio@sha256:e9cf6b99c226e9539ed0f14b6f00e37b07da153c7ba1f4f8709c807574b471ec
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?define MINIO_ROOT_USER en infra/minio/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?define MINIO_ROOT_PASSWORD en infra/minio/.env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  minio-data: